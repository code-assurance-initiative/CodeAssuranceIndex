name: DCO
on: pull_request
permissions:
  contents: read
jobs:
  sign-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Every commit carries a Signed-off-by line
        run: |
          missing=0
          for c in $(git rev-list "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"); do
            if ! git show -s --format=%B "$c" | grep -qE '^Signed-off-by: .+ <.+>'; then
              echo "::error::commit $c has no Signed-off-by line — commit with 'git commit -s' (see docs/IPR.md)"
              missing=1
            fi
          done
          exit $missing
